<!DOCTYPE html>
<html lang="en">
   <head>
      <meta charset="UTF-8" />
      <meta name="viewport" content="width=device-width, initial-scale=1.0" />
      <title>OCR Neural Network</title>
      <style>
         body {
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin: 0;
            padding: 20px;
            text-align: center;
         }
         .container {
            display: flex;
            flex-wrap: wrap;
            width: fit-content;
            justify-content: center;
         }
         .panel {
            border: 1px solid #ccc;
            padding: 10px;
            box-shadow: 2px 2px 5px rgba(0, 0, 0, 0.1);
            display: flex;
            flex-direction: column;
            align-items: center;
            button {
               width: 100%;
            }
         }
         #drawingPanel {
            border: 2px solid #000;
         }
         #clearButton {
            margin-top: 10px;
         }

         #whatComputerSees {
            width: 100%;
            height: 100%;
            border: 2px solid #000;
            image-rendering: pixelated;
            width: 300px;
            height: 300px;
         }

         #predictionPanel {
            display: flex;
            text-align: left;
            justify-content: left;
            width: 300px;
            font-size: 24px;
            line-height: 1;
         }
         #probabilityChart {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            width: 300px;
            margin-top: 10px;
         }
         .bar {
            display: flex;
            align-items: center;
            margin-bottom: 4px;
            width: 100%;
         }
         .bar span {
            width: 30px;
            text-align: right;
            margin-right: 8px;
         }
         .bar div {
            height: 20px;
            border: 1px solid #ccc;
            border-radius: 4px;
            background-color: #4caf50;
            transition: width 0.3s;
         }
         #infoSection {
            margin-top: 20px;
            padding: 10px;
            text-align: center;
            font-size: 14px;
            color: #333;
         }

         #infoSection a {
            color: #007bff;
            text-decoration: none;
         }

         #infoSection a:hover {
            text-decoration: underline;
         }
      </style>
   </head>
   <body>
      <h1>Optical Character Recognition</h1>
      <div class="container">
         <div class="panel" id="drawingPanelContainer">
            <h2>Draw Your Digit Here:</h2>
            <canvas id="drawingPanel" width="300" height="300"></canvas>
            <button id="clearButton">Clear</button>
         </div>
         <div class="panel" id="whatComputerSeesPanelContainer">
            <h2>What the NN Sees:</h2>
            <img id="whatComputerSees" />
         </div>
         <div class="panel" id="predictionPanelContainer">
            <h2>Prediction:</h2>
            <div id="predictionPanel">Predicted digit: unknown</div>
            <div id="probabilityChart"></div>
         </div>
      </div>
      <div id="infoSection">
         <p>Author: Shane Koester</p>
         <p>
            <a
               href="https://github.com/ItsMeShane/OpticalCharacterRecognition"
               target="_blank"
               >GitHub</a
            >
            |
            <a href="https://shanekoester.com" target="_blank">Website</a>
         </p>
      </div>

      <script>
         const canvas = document.getElementById('drawingPanel');
         const prediction = document.getElementById('predictionPanel');
         const whatComputerSees = document.getElementById('whatComputerSees');
         // the preview reads the canvas pixels many times per second
         const ctx = canvas.getContext('2d', { willReadFrequently: true });
         ctx.fillStyle = 'white';
         ctx.fillRect(0, 0, canvas.width, canvas.height);
         const clearButton = document.getElementById('clearButton');
         let drawing = false;
         function startDrawing(event) {
            event.preventDefault();
            drawing = true;
         }
         function stopDrawing() {
            drawing = false;
            ctx.beginPath();
         }
         function getCoordinates(event) {
            const { clientX, clientY } = event.type.startsWith('touch')
               ? event.touches[0]
               : event;
            const rect = canvas.getBoundingClientRect();
            return {
               x: clientX - rect.left,
               y: clientY - rect.top,
            };
         }
         function draw(event) {
            event.preventDefault();
            if (!drawing) return;
            const { x, y } = getCoordinates(event);
            ctx.lineWidth = 25;
            ctx.lineCap = 'round';
            ctx.strokeStyle = 'black';
            ctx.lineTo(x, y);
            ctx.stroke();
            ctx.beginPath();
            ctx.moveTo(x, y);
            updatePreview();
         }

         // redraw "What the NN Sees", at most once per screen refresh
         let previewQueued = false;
         function updatePreview() {
            if (previewQueued) return;
            previewQueued = true;
            requestAnimationFrame(() => {
               previewQueued = false;
               whatComputerSees.src = preprocessCanvas(canvas);
            });
         }
         canvas.addEventListener('mousedown', startDrawing);
         canvas.addEventListener('mouseup', stopDrawing);
         canvas.addEventListener('mousemove', draw);
         canvas.addEventListener('mouseleave', stopDrawing);
         canvas.addEventListener('touchstart', startDrawing);
         canvas.addEventListener('touchend', stopDrawing);
         canvas.addEventListener('touchmove', draw);

         clearButton.addEventListener('click', () => {
            ctx.fillStyle = 'white';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            updatePreview();
            updatePrediction();
         });

         function updatePrediction() {
            const scaledDataURL = preprocessCanvas(canvas); // Crop, scale and center to 28x28
            fetch('/predict', {
               method: 'POST',
               headers: {
                  'Content-Type': 'application/json',
               },
               body: JSON.stringify({ image: scaledDataURL }),
            })
               .then((response) => response.json())
               .then((data) => {
                  const predictedDigit = data.probabilities.indexOf(
                     Math.max(...data.probabilities)
                  );
                  // if the certainty is under 50% then digit is 'unknown'
                  prediction.innerHTML =
                     data.probabilities[predictedDigit] < 0.5
                        ? 'Predicted digit: unknown'
                        : `Predicted digit: ${predictedDigit}`;

                  // update or create bar chart
                  const chartContainer = document.getElementById('probabilityChart');
                  data.probabilities.forEach((prob, i) => {
                     let bar = document.getElementById(`bar-${i}`);
                     if (!bar) {
                        bar = document.createElement('div');
                        bar.className = 'bar';
                        bar.id = `bar-${i}`;
                        bar.innerHTML = `<span>${i}:</span><div style="width: 0%"></div>`;
                        chartContainer.appendChild(bar);
                     }
                     const percentage = (prob * 100).toFixed(0);
                     bar.querySelector('div').style.width = `${percentage}%`;
                  });
               })
               .catch((error) => console.error('Error:', error));
         }

         function preprocessCanvas(canvas) {
            const { width, height } = canvas;
            const pixels = canvas.getContext('2d').getImageData(0, 0, width, height).data;
            const digit = preprocessPixels(pixels, width, height) || new Float32Array(28 * 28);

            const smallCanvas = document.createElement('canvas');
            smallCanvas.width = 28;
            smallCanvas.height = 28;
            const smallCtx = smallCanvas.getContext('2d');
            const image = smallCtx.createImageData(28, 28);
            for (let i = 0; i < 28 * 28; i++) {
               const gray = Math.round(255 * (1 - digit[i])); // black ink on white
               image.data.set([gray, gray, gray, 255], i * 4);
            }
            smallCtx.putImageData(image, 0, 0);
            return smallCanvas.toDataURL('image/png');
         }

         function preprocessPixels(pixels, width, height) {
            const ink = new Float32Array(width * height);
            let top = height, bottom = -1, left = width, right = -1;
            for (let y = 0; y < height; y++) {
               for (let x = 0; x < width; x++) {
                  const value = 1 - pixels[(y * width + x) * 4] / 255;
                  ink[y * width + x] = value;
                  if (value > 0.1) {
                     top = Math.min(top, y);
                     bottom = Math.max(bottom, y);
                     left = Math.min(left, x);
                     right = Math.max(right, x);
                  }
               }
            }
            if (bottom < 0) return null;

            // shrink the box so its longest side is 20 px, keeping the aspect ratio and place it in the middle of a 28x28 image
            const w = right - left + 1, h = bottom - top + 1;
            const scale = 20 / Math.max(w, h);
            const sw = Math.max(1, Math.round(w * scale)), sh = Math.max(1, Math.round(h * scale));
            const colWeights = areaWeights(w, sw), rowWeights = areaWeights(h, sh);
            const offsetX = Math.floor((28 - sw) / 2), offsetY = Math.floor((28 - sh) / 2);
            const digit = new Float32Array(28 * 28);
            for (let ty = 0; ty < sh; ty++) {
               for (let tx = 0; tx < sw; tx++) {
                  let sum = 0;
                  for (const [sy, wy] of rowWeights[ty]) {
                     for (const [sx, wx] of colWeights[tx]) {
                        sum += ink[(top + sy) * width + left + sx] * wy * wx;
                     }
                  }
                  digit[(offsetY + ty) * 28 + offsetX + tx] = sum;
               }
            }

            // shift the image so its center of mass lands on pixel (14, 14)
            let total = 0, cy = 0, cx = 0;
            for (let i = 0; i < 28 * 28; i++) {
               total += digit[i];
               cy += Math.floor(i / 28) * digit[i];
               cx += (i % 28) * digit[i];
            }
            const dy = Math.round(14 - cy / total), dx = Math.round(14 - cx / total);
            const centered = new Float32Array(28 * 28);
            for (let y = 0; y < 28; y++) {
               for (let x = 0; x < 28; x++) {
                  const sy = y - dy, sx = x - dx;
                  if (sy >= 0 && sy < 28 && sx >= 0 && sx < 28) {
                     centered[y * 28 + x] = digit[sy * 28 + sx];
                  }
               }
            }
            return centered;
         }

         function areaWeights(n, m) {
            const ratio = n / m;
            const weights = [];
            for (let i = 0; i < m; i++) {
               const start = i * ratio, end = (i + 1) * ratio;
               const pairs = [];
               for (let j = Math.floor(start); j < Math.min(n, Math.ceil(end)); j++) {
                  const overlap = Math.min(j + 1, end) - Math.max(j, start);
                  if (overlap > 0) pairs.push([j, overlap / ratio]);
               }
               weights.push(pairs);
            }
            return weights;
         }
         // update prediction every 400 milliseconds
         setInterval(() => {
            updatePrediction();
         }, 400);
         updatePreview();
      </script>
   </body>
</html>
